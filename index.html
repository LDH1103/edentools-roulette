<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>구슬 레이스</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/manifest.json">
  <meta name="theme-color" content="#111111">

  <meta name="description" content="링크 하나로 모두가 같은 구슬 레이스를 보는 추첨기. 주최자가 시작을 누르면 모든 화면에서 동시에 출발합니다.">
  <meta property="og:url" content="https://roulette.edentools.dev/">
  <meta property="og:title" content="구슬 레이스">
  <meta property="og:description" content="링크 하나로 모두가 같은 구슬 레이스를 보는 추첨기">
  <meta property="og:type" content="website">

  <link rel='stylesheet' href='assets/style.scss' />
</head>
<body>
<script type="module" src="./src/index.ts"></script>
<h1 class="sr-only">구슬 레이스 - 링크 하나로 함께 보는 추첨</h1>

<button id="btnTheme" class="btn-theme" type="button" title="테마 바꾸기" aria-label="테마 바꾸기">☀</button>

<!-- 설정 모드: 주최자가 참가자·당첨 방식을 정하고 링크를 만들거나, 방 없이 혼자 돌린다 -->
<div id="settings" class="settings" hidden>
  <div class="right">
    <button id="btnToggleSettings" class="btn-toggle-settings" type="button">
      <span>설정</span>
      <i class="toggle-arrow">▲</i>
    </button>
    <div class="collapsible-rows collapsed">
      <div class="row">
        <label for='sltMap'>
          <i class="icon map"></i>
          <span>맵</span>
        </label>
        <div class="map-picker">
          <select id="sltMap"></select>
        </div>
      </div>
      <div class="row row-toggles">
        <div class='toggle-item'>
          <label for='chkAutoRecording'>
            <i class="icon record"></i>
            <span>녹화</span>
          </label>
          <input type="checkbox" id="chkAutoRecording" />
        </div>
        <div class='toggle-item'>
          <label for='chkSkill'>
            <i class="icon bomb"></i>
            <span>스킬</span>
          </label>
          <input type="checkbox" id="chkSkill" checked />
        </div>
      </div>
      <div class="row">
        <label>
          <i class="icon trophy"></i>
          <span>당첨</span>
        </label>
        <div class="btn-group">
          <button class="btn-winner active" type="button" data-type="first">먼저 도착</button>
          <button class="btn-winner" type="button" data-type="last">마지막 도착</button>
          <button class="btn-winner" type="button" data-type="custom">특정 등수</button>
          <button class="btn-winner" type="button" data-type="multi">범위</button>
        </div>
      </div>
      <div class="row row-winner-detail" id="winCountRow">
        <label></label>
        <div class="btn-group range-group">
          <input type="number" id="in_winCount" value="1" min="1" inputmode="numeric" />
          <span class="range-sep">명</span>
        </div>
      </div>
      <div class="row row-winner-detail" id="winRankRow" hidden>
        <label></label>
        <div class="btn-group range-group">
          <input type="number" id="in_rank" value="1" min="1" inputmode="numeric" />
          <span class="range-sep">등</span>
        </div>
      </div>
      <div class="row row-winner-detail" id="winRangeRow" hidden>
        <label></label>
        <div class="btn-group range-group">
          <input type="number" id="in_rangeStart" value="1" min="1" inputmode="numeric" />
          <span class="range-sep">~</span>
          <input type="number" id="in_rangeEnd" value="3" min="1" inputmode="numeric" />
          <span class="range-sep">등</span>
        </div>
      </div>
      <div class="row">
        <label></label>
        <span class="winner-summary" id="winnerSummary"></span>
      </div>
    </div>
  </div>
  <div class="left">
    <h3>참가자 이름 (쉼표나 줄바꿈으로 구분 · 이름/가중치*개수)</h3>
    <textarea id="in_names" placeholder="홍길동&#10;김철수*2&#10;이영희/3"></textarea>
    <div class="roster">
      <div class="roster-head">
        <span>저장된 명단 <small>클릭하면 참가자에 넣거나 뺍니다</small></span>
        <span class="roster-actions">
          <button type="button" class="btn small" id="rosterAll">전체 추가</button>
          <button type="button" class="btn small" id="rosterNone">전체 빼기</button>
        </span>
      </div>
      <div class="chips" id="rosterChips"></div>
      <p class="roster-empty" id="rosterEmpty">아직 저장된 명단이 없습니다. 아래 "명단 편집"에서 팀원 이름을 한 번 저장해 두면 다음부터는 클릭만으로 고를 수 있습니다.</p>
      <details id="rosterDetails">
        <summary>명단 편집</summary>
        <textarea id="rosterEdit" placeholder="팀원 이름을 한 줄에 한 명씩"></textarea>
        <div class="roster-actions">
          <button type="button" class="btn small" id="rosterSave">명단 저장</button>
          <button type="button" class="btn small" id="rosterFromNames">현재 참가자를 명단에 추가</button>
          <small>이 브라우저에만 저장됩니다.</small>
        </div>
      </details>
    </div>
    <p class="setup-error" id="setupError" role="alert" hidden></p>
    <div class="actions">
      <button id="btnShuffle" type="button">
        <i class="icon shuffle"></i>
        <span>섞기</span>
      </button>
      <div class="sep"></div>
      <button id="btnLocal" type="button">
        <i class="icon play"></i>
        <span>혼자 돌리기</span>
      </button>
      <button id="btnCreateRoom" class="primary" type="button">공유 링크 만들기</button>
    </div>
  </div>
</div>

<!-- 방 모드: 같은 링크를 연 모두가 같은 레이스를 본다 -->
<div id="roombar" class="roombar" hidden>
  <div class="roombar-info">
    <span class="room-id">방 <b id="roomId"></b></span>
    <span id="roomCount">접속 0명</span>
    <span id="roomSummary"></span>
    <span id="roomNet" class="net">연결 중</span>
  </div>
  <div class="roombar-actions">
    <label class="room-record"><input type="checkbox" id="chkRoomRecord" /> 내 화면 녹화</label>
    <button id="btnCopyLink" type="button">링크 복사</button>
    <button id="btnCopySlack" type="button">Slack 문구 복사</button>
    <button id="btnHostStart" class="primary" type="button" hidden>시작</button>
    <button id="btnHostReset" type="button" hidden>다시 추첨</button>
    <a id="lnkNewRoom" class="btn" href="./">새 추첨 만들기</a>
  </div>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-card">
    <p class="overlay-eyebrow" id="overlayEyebrow"></p>
    <div class="overlay-big" id="overlayBig"></div>
    <p class="overlay-text" id="overlayText"></p>
  </div>
</div>

<div class="copyright">구슬 레이스 · based on <a href="https://github.com/lazygyu/roulette" target="_blank" rel="noopener">Marble Roulette</a> by lazygyu (MIT)</div>
</body>
</html>
