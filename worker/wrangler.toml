name = "roulette-sync"
main = "src/index.ts"
compatibility_date = "2026-05-01"

routes = [
  { pattern = "roulette-api.edentools.dev", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "https://roulette.edentools.dev,http://localhost:1235,http://127.0.0.1:1235"
API_ORIGIN = "https://roulette-api.edentools.dev"
SITE_URL = "https://roulette.edentools.dev/"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 공용 저장소: 쓰는 사람 모두가 명단·마지막 설정·Slack 채널을 같이 쓴다
[[durable_objects.bindings]]
name = "STORE"
class_name = "SharedStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SharedStore"]
